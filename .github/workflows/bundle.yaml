
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: gobgame-pic
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -e
          
          # 检查必要的环境变量
          echo "检查环境变量..."
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "❌ 错误: R2_ACCOUNT_ID 未设置"
            echo "请在 GitHub 仓库 Settings → Secrets → Actions 中添加 R2_ACCOUNT_ID"
            exit 1
          fi
          
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ 错误: AWS 凭据未设置"
            echo "请在 GitHub 仓库 Settings → Secrets → Actions 中添加 R2_ACCESS_KEY_ID 和 R2_SECRET_ACCESS_KEY"
            exit 1
          fi

          # 构建端点 URL
          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "✅ 使用端点: $ENDPOINT_URL"
          echo "✅ 目标存储桶: $R2_BUCKET"

          # 检查构建产物
          echo "检查构建产物..."
          if [ ! -f "dist/哥布林巢穴-简版/index.html" ]; then
            echo "❌ 错误: dist/哥布林巢穴-简版/index.html 不存在"
            echo "当前目录内容:"
            ls -la
            echo "dist 目录内容:"
            ls -la dist/ || echo "dist 目录不存在"
            exit 1
          fi

          echo "✅ 找到 index.html 文件"
          echo "文件大小: $(du -h dist/哥布林巢穴-简版/index.html | cut -f1)"

          # 安装 AWS CLI（如果不存在）
          if ! command -v aws &> /dev/null; then
            echo "安装 AWS CLI..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi

          echo "🚀 开始上传到 Cloudflare R2..."
          
          # 上传文件
          aws s3 cp dist/哥布林巢穴-简版/index.html "s3://${R2_BUCKET}/index.html" \
            --endpoint-url "$ENDPOINT_URL" \
            --content-type "text/html" \
            --cache-control "no-cache, must-revalidate" \
            --region auto

          echo "✅ 文件上传成功!"
          echo "📊 验证上传..."
          
          # 验证上传
          aws s3 ls "s3://${R2_BUCKET}/index.html" \
            --endpoint-url "$ENDPOINT_URL" \
            --region auto
            
          echo "🎉 Cloudflare R2 上传完成!"
