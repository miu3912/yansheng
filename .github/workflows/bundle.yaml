name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    if: github.repository != 'StageDog/tavern_helper_template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - run: pnpm install && pnpm format && pnpm build
      
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'
          token: ${{ secrets.GITHUB_TOKEN }}

      # 自动打版本 tag
      - id: autotag
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          with-v: true
          
      - if: ${{ steps.autotag.outputs.tag != '0.0.0' }}
        run: |
          git push origin ${{ steps.autotag.outputs.tag }} || echo "标签推送失败，继续执行"

      # 跳过 R2 上传（因为缺少 Secrets）
      - name: Skip R2 Upload (No Secrets)
        run: |
          echo "⚠️  跳过 Cloudflare R2 上传：仓库中没有设置必要的 Secrets"
          echo "如需启用 R2 上传，请在仓库 Settings -> Secrets and variables -> Actions 中添加："
          echo "- R2_ACCOUNT_ID"
          echo "- R2_ACCESS_KEY_ID" 
          echo "- R2_SECRET_ACCESS_KEY"
          echo "- CLOUDFLARE_API_TOKEN"
          echo "- CF_ZONE_ID"

      # 跳过 Cloudflare 缓存清理（因为缺少 Secrets）
      - name: Skip Cloudflare Cache Purge (No Secrets)
        run: |
          echo "⚠️  跳过 Cloudflare 缓存清理：缺少必要的 Secrets"
